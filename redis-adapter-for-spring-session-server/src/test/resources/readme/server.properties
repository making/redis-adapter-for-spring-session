# The regions between the markers are quoted verbatim in README.md as the settings an
# operator gives any adapter server, whichever backend it was built around.
# ReadmeConfigurationExamplesTests starts a real server from each region, substituting the
# values that cannot be real in a test - the address and port it listens on, and where the
# certificate material is. What a backend itself is given lives in that backend's own
# server module, beside the tests that run it.

# tag::server-settings[]
redis-adapter.bind-address=0.0.0.0
redis-adapter.port=6379
redis-adapter.databases=1
redis-adapter.password=s3cret
# end::server-settings[]

# tag::server-tls[]
redis-adapter.ssl.bundle=adapter
redis-adapter.ssl.client-auth=none
spring.ssl.bundle.pem.adapter.keystore.certificate=file:/etc/adapter/tls/tls.crt
spring.ssl.bundle.pem.adapter.keystore.private-key=file:/etc/adapter/tls/tls.key
spring.ssl.bundle.pem.adapter.reload-on-update=true
# end::server-tls[]
