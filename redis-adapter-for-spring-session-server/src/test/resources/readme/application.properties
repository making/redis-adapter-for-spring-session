# The regions between the markers are quoted verbatim in README.md as the settings an
# application connecting to the adapter uses. ReadmeConfigurationExamplesTests loads each
# region and drives a real client with it, substituting the values that cannot be real in
# a test - the host and port of the adapter, and where the certificate material is. The
# session settings are run by the tests under com.example.session instead, since what they
# change is what Spring Boot builds, not how a client connects.

# tag::app-connection[]
spring.data.redis.host=adapter.example.com
spring.data.redis.port=6379
# end::app-connection[]

# tag::app-indexed[]
spring.session.data.redis.repository-type=indexed
# end::app-indexed[]

# tag::app-namespace[]
spring.session.data.redis.namespace=acme:web
spring.data.redis.database=1
# end::app-namespace[]

# tag::app-password[]
spring.data.redis.password=s3cret
# end::app-password[]

# tag::app-tls[]
spring.data.redis.ssl.enabled=true
spring.data.redis.ssl.bundle=adapter
spring.ssl.bundle.pem.adapter.truststore.certificate=file:/etc/app/tls/ca.crt
# end::app-tls[]
