spring.application.name=session-example-etcd

# The adapter, not Redis. This is the entire integration: the starter on the class path
# configures Spring Session, and these two lines say where the sessions go.
spring.data.redis.host=${ADAPTER_HOST:localhost}
spring.data.redis.port=${ADAPTER_PORT:6379}

# How long a session nobody comes back to is kept. The adapter gives the key this
# lifetime in etcd, and etcd is what removes it.
spring.session.timeout=30m

# Shown on the page, so that two instances can be told apart.
example.instance-name=${INSTANCE_NAME:app-1}
