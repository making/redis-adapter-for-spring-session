name: Java CI with Maven

on:
  push:
    branches:
    - develop
    - main
    paths:
    - '**/src/**'
    - pom.xml
    - '**/pom.xml'
    - .github/workflows/ci.yaml
  pull_request:
    branches:
    - develop
    - main
    paths:
    - '**/src/**'
    - pom.xml
    - '**/pom.xml'
    - .github/workflows/ci.yaml
  workflow_dispatch:
    inputs:
      deploy_resume_from:
        description: >-
          Maven module to resume the deploy from (mvn -rf), for retrying a deploy that
          failed partway through the reactor without re-publishing the modules that
          already reached Maven Central. Leave empty for a normal full deploy.
        required: false
        default: ''
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'liberica'
        cache: maven
    - name: Unit Tests
      run: ./mvnw -V --no-transfer-progress clean test
  # An example is a project of its own rather than a module, so the build above never
  # touches it. They are built here because an example nothing runs is an example that
  # rots: each drives a browser against two applications, over the adapter and then over
  # a real Redis, and the two runs have to agree.
  examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [session-example-etcd, session-example-dynamodb, session-example-foundationdb]
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'liberica'
        cache: maven
    - name: Install the adapter
      run: ./mvnw -V --no-transfer-progress install -DskipTests
    - name: End-to-End Tests
      working-directory: examples/${{ matrix.example }}
      run: ./mvnw -V --no-transfer-progress test
    - name: End-to-End Tests against Redis
      working-directory: examples/${{ matrix.example }}
      run: ./mvnw -V --no-transfer-progress test -Dspring.profiles.active=redis
  deploy:
    needs: test
    if: |
      github.event_name != 'pull_request' &&
      !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Import Secrets
      id: secrets
      uses: hashicorp/vault-action@v4.0.0
      with:
        exportToken: true
        method: jwt
        url: ${{ secrets.VAULT_ADDR }}
        role: cicd
        secrets: |
          kv/data/cicd/maven_central username | MAVEN_CENTRAL_USERNAME ;
          kv/data/cicd/maven_central password | MAVEN_CENTRAL_PASSWORD ;
          kv/data/cicd/gpg secring | GPG_SECRING ;
          kv/data/cicd/gpg passphrase | GPG_PASSPHRASE ;
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'liberica'
        cache: maven
        gpg-private-key: ${{ steps.secrets.outputs.GPG_SECRING }}
        gpg-passphrase: ${{ steps.secrets.outputs.GPG_PASSPHRASE }}
    - name: Generates Maven Settings
      uses: s4u/maven-settings-action@v4.0.0
      with:
        servers: |
          [{
              "id": "central",
              "username": "${{ steps.secrets.outputs.MAVEN_CENTRAL_USERNAME }}",
              "password": "${{ steps.secrets.outputs.MAVEN_CENTRAL_PASSWORD }}"
          }]
    - name: Deploy to Maven Central
      env:
        DEPLOY_RESUME_FROM: ${{ github.event.inputs.deploy_resume_from }}
      run: |
        set -e
        RESUME_ARGS=()
        if [ -n "${DEPLOY_RESUME_FROM}" ]; then
          RESUME_ARGS=(-rf ":${DEPLOY_RESUME_FROM}")
        fi
        mvn -V \
            javadoc:jar \
            source:jar \
            package \
            org.apache.maven.plugins:maven-gpg-plugin:3.0.1:sign \
            deploy \
            --no-transfer-progress \
            -Dgpg.passphrase=${GPG_PASSPHRASE} \
            -DskipTests=true \
            "${RESUME_ARGS[@]}"
    - name: Revoke token
      if: always()
      run: |
        curl -X POST -s -H "X-Vault-Token: ${VAULT_TOKEN}" ${{ secrets.VAULT_ADDR }}/v1/auth/token/revoke-self || true
