# The region between the markers is quoted verbatim in README.md as what the FoundationDB
# backend runs with. ReadmeFoundationDbExamplesTests builds a real server from it, so a
# property name that is subtly wrong - which would bind to nothing and change nothing -
# fails here rather than in a deployment.

# tag::server-foundationdb[]
redis-adapter.foundationdb.cluster-file=/etc/foundationdb/fdb.cluster
redis-adapter.foundationdb.key-prefix=/redis-adapter/
# end::server-foundationdb[]
