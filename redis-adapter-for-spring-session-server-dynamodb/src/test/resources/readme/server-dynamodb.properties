# The region between the markers is quoted verbatim in README.md as what the DynamoDB
# backend runs with. ReadmeDynamoDbExamplesTests builds a real server from it, so a
# property name that is subtly wrong - which would bind to nothing and change nothing -
# fails here rather than in a deployment.

# tag::server-dynamodb[]
spring.cloud.aws.region.static=ap-northeast-1
redis-adapter.dynamodb.table-name=redis-adapter
redis-adapter.dynamodb.shards=4
# end::server-dynamodb[]
