# Every test in this module runs the adapter on an ephemeral loopback port: the default
# 6379 would collide with a Redis the developer happens to be running, and a test has no
# business binding a public address.
redis-adapter.bind-address=127.0.0.1
redis-adapter.port=0
# Where DynamoDB is and how it is signed for is Spring Cloud AWS's business; the tests
# that talk to the emulator override the endpoint and credentials per container, and
# these defaults only let a context that never reaches DynamoDB assemble its client.
spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.credentials.access-key=test
spring.cloud.aws.credentials.secret-key=test
