# The region between the markers is quoted verbatim in README.md as what the etcd backend
# is pointed at. ReadmeEtcdConfigurationExamplesTests starts a real server from it, so a
# property name that is subtly wrong - which would bind to nothing and change nothing -
# fails here rather than in a deployment.

# tag::server-etcd[]
redis-adapter.etcd.endpoints=http://etcd-0:2379,http://etcd-1:2379,http://etcd-2:2379
redis-adapter.etcd.key-prefix=/redis-adapter/
# end::server-etcd[]
